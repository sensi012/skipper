name: Bug Report
description: Report unexpected behavior, build failures, panics, or CLI/MCP errors in Skipper
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill out the details below so we can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact `skipper` command(s) run and relevant `skipper.yaml` / `docker-compose.yml` snippet.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect Skipper to do, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `skipper --version`, OS/arch, and Docker/Kubernetes version (`docker --version`, `kubectl version --client`).
      placeholder: |
        skipper --version: 0.1.1
        OS: Linux / macOS / Windows
        Docker: 26.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic output / stderr logs
      description: Paste relevant stderr output or `skipper doctor --format json` (redact any secrets).
      render: shell
    validations:
      required: false
